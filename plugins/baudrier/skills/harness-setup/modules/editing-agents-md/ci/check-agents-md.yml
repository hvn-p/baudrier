# baudrier editing-agents-md module: checks every AGENTS.md and CLAUDE.md on
# pull requests, with the amendment limits measured from the base branch.
# GitHub Actions; translate it to the project's CI if it uses another one.
name: Agent instructions

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-agents-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The amendment limits diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check AGENTS.md and CLAUDE.md
        env:
          BASE: origin/${{ github.base_ref }}
        run: node <<SCRIPTS_DIR>>/check-agents-md.mjs --base "$BASE"
