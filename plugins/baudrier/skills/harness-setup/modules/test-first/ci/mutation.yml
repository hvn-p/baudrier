# baudrier mutation CI job, version 2.
#
# Mutation testing on the source files a branch changes, against the pull
# request's base or the default branch. The test audit reads its result. It
# runs on pull requests, or on demand with workflow_dispatch when a run per
# pull request costs too much. GitHub Actions; translate it to the project's
# CI if it uses another one.
name: Mutation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ADAPT: set up the project's toolchain and install its dependencies.
      - name: List the changed source files
        id: changed
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        # ADAPT: the pathspecs of source files, tests excluded.
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- <<SOURCE_PATHSPECS>> | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Mutation testing
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        # ADAPT: the language's mutation tool, scoped to "$FILES" (comma-separated).
        run: <<MUTATION_COMMAND>>
