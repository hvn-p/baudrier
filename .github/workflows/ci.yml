name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version check diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test 'tests/**/*.test.mjs'
      - name: Validate the marketplace and the plugin
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.288
          claude plugin validate --strict .
          claude plugin validate --strict plugins/baudrier
      - name: Require a version bump when the plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/scripts/check-version-bump.sh "$BASE"
